# Local development / QA stack for BookPoint.
# Usage (from repo root):  docker compose -f .dev/docker-compose.yml up -d
# Site: http://localhost:8088 (admin / admin). Mail: http://localhost:8025 (Mailpit).
name: bookpoint-dev
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
    command: ["--sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"]
    volumes:
      - dbdata:/var/lib/mysql
  wordpress:
    image: wordpress:6.8-php8.2-apache
    depends_on: [db]
    ports:
      - "8088:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/pointly-booking
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
  cli:
    image: wordpress:cli-php8.2
    depends_on: [db, wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/pointly-booking
    entrypoint: ["sleep", "infinity"]
volumes:
  dbdata:
  wp:
